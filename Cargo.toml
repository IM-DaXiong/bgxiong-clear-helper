[package]
name = "bgxiong-clear-helper"
version = "0.1.720"
edition = "2021"
description = "比格熊C盘清理助手 — Windows C drive junk file cleaner with GUI"
authors = ["im.daxiong <bgxiong.ai@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
homepage = "https://bgxiong.com"
repository = "https://github.com/IM-DaXiong/bgxiong-clear-helper"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
walkdir = "2"
rayon = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
